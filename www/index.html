<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Akar Keluarga</title>
<style>
:root{
  --bg:#f3ede0; --ink:#2f2a20; --ink-soft:#6b6252;
  --root:#3c5b45; --root-deep:#24382b;
  --card:#fffaf0; --card-border:#ddd2b8; --gold:#a97d34;
  --hidup:#4f7a5a; --meninggal:#a3453b; --garis:#a8946b;
  --font-title:Georgia,'Iowan Old Style','Times New Roman',serif;
  --font-body:-apple-system,Roboto,'Segoe UI',sans-serif;
  --pz:1;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:#1b1712;color:var(--ink);font-family:var(--font-body);overflow:hidden;overscroll-behavior:none;}

/* Bingkai seukuran ponsel: di layar lebar konten dikunci selebar ponsel dan ditengahkan. */
.frame-luar{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1b1712;}
.frame-ponsel{position:relative;width:100%;max-width:430px;height:100%;max-height:100dvh;background:var(--bg);overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,0.4);}

.topbar{position:absolute;top:0;left:0;right:0;z-index:10;padding:14px 18px;background:linear-gradient(to bottom,var(--bg) 75%,transparent);padding-top:calc(14px + env(safe-area-inset-top,0px));pointer-events:none;}
.topbar h1{font-family:var(--font-title);font-size:19px;font-weight:normal;color:var(--root-deep);margin:0;}
.viewport{position:absolute;inset:0;touch-action:none;}
.canvas{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform;}

.node{position:absolute;width:104px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;}
.avatar-wrap{position:relative;width:58px;height:58px;}
.avatar{width:58px;height:58px;border-radius:50%;background:#e4dabf;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--root-deep);border:1px solid var(--card-border);}
.node.aktif .avatar{box-shadow:0 0 0 2px var(--gold);}
.status-dot{position:absolute;top:0;right:0;width:12px;height:12px;border-radius:50%;border:2px solid var(--bg);}
.status-dot.hidup{background:var(--hidup);}
.status-dot.meninggal{background:var(--meninggal);}
.node .nama{font-size:12px;line-height:1.25;text-align:center;color:var(--ink);max-height:2.5em;overflow:hidden;}
.node .nama.kosong{color:var(--ink-soft);font-style:italic;}
.node .umur{font-size:10px;color:var(--ink-soft);line-height:1.2;min-height:12px;}

.line{position:absolute;background:var(--garis);}
.line-v{width:2px;}
.line-h{height:2px;}

/* Tombol aksi kiri bawah - absolute terhadap .frame-ponsel, tidak ikut pan/zoom. */
.fab-wrap{position:absolute;left:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:15;}
.fab{width:48px;height:48px;border-radius:50%;border:1px solid var(--card-border);background:var(--card);color:var(--root-deep);font-size:20px;box-shadow:0 2px 6px rgba(0,0,0,0.12);}
.fab-menu{position:absolute;bottom:56px;left:0;display:flex;flex-direction:column;gap:8px;min-width:170px;}
.fab-menu.hidden{display:none;}
.fab-menu button{padding:10px 14px;border-radius:10px;border:1px solid var(--card-border);background:var(--card);color:var(--root-deep);font-size:13px;text-align:left;box-shadow:0 2px 6px rgba(0,0,0,0.1);}

#inputRestore{display:none;}

.modal-overlay{position:absolute;inset:0;background:rgba(36,30,20,0.4);display:flex;align-items:flex-end;z-index:20;}
.modal-overlay.hidden{display:none;}
.modal{width:100%;background:var(--bg);border-radius:16px 16px 0 0;padding:18px 18px calc(22px + var(--bawah-aman));max-height:82vh;overflow-y:auto;}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.modal-header h2{font-family:var(--font-title);font-weight:normal;font-size:18px;margin:0;}
.btn-icon{width:34px;height:34px;border-radius:50%;border:1px solid var(--card-border);background:var(--card);color:var(--root-deep);font-size:15px;}
.modal-body label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:12px;}
.modal-body input,.modal-body select{display:block;width:100%;margin-top:5px;padding:9px 10px;border:1px solid var(--card-border);border-radius:8px;background:var(--card);font-size:14px;color:var(--ink);}
.modal-body .baris-tgl{display:flex;gap:6px;margin-top:5px;}
.modal-body .baris-tgl input{width:auto;flex:1;min-width:0;margin-top:0;}
#wrapWafat{display:none;}
.foto-thumb{width:48px;height:48px;border-radius:50%;background-size:cover;background-position:center;border:1px solid var(--card-border);}
.btn-kecil{padding:6px 10px;border-radius:8px;border:1px solid var(--card-border);background:var(--card);font-size:12px;color:var(--meninggal);}
.relasi-info{font-size:12px;color:var(--ink-soft);border-top:1px solid var(--card-border);padding-top:10px;}
.relasi-info p{margin:4px 0;}
.modal-actions{display:flex;gap:10px;margin-top:6px;}
.btn-utama,.btn-bahaya{flex:1;padding:11px;border-radius:8px;border:none;font-size:14px;}
.btn-utama{background:var(--root);color:#fff;}
.btn-bahaya{background:transparent;color:var(--meninggal);border:1px solid var(--card-border);}
.modal-tambah{margin-top:16px;border-top:1px solid var(--card-border);padding-top:12px;}
.modal-tambah-judul{font-size:12px;color:var(--ink-soft);margin:0 0 8px;}
.modal-tambah-tombol{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.modal-tambah-tombol button{padding:9px;border-radius:8px;border:1px solid var(--card-border);background:var(--card);font-size:13px;color:var(--root-deep);}


/* ===== Header, tombol menu, tombol pusat ===== */
.topbar{display:flex;align-items:center;gap:12px;}
.btn-menu{pointer-events:auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--card-border);background:var(--card);color:var(--root-deep);display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 1px 4px rgba(0,0,0,0.1);}
.btn-pusat{position:absolute;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:15;width:48px;height:48px;border-radius:50%;border:1px solid var(--card-border);background:var(--card);color:var(--root-deep);display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 2px 6px rgba(0,0,0,0.15);}
.btn-pusat:active,.btn-menu:active{background:#eadfc6;}

/* ===== Drawer ===== */
.scrim{position:absolute;inset:0;background:rgba(36,30,20,0.45);z-index:30;}
.scrim.hidden{display:none;}
.drawer{position:absolute;top:0;bottom:0;left:0;width:78%;max-width:300px;background:var(--bg);z-index:31;transform:translateX(-102%);transition:transform .2s ease;display:flex;flex-direction:column;box-shadow:2px 0 14px rgba(0,0,0,0.25);padding-bottom:calc(14px + var(--bawah-aman));}
.drawer.buka{transform:translateX(0);}
.drawer-kepala{padding:calc(22px + env(safe-area-inset-top,0px)) 20px 16px;background:var(--root-deep);color:#f3ede0;}
.drawer-kepala h2{margin:0;font-family:var(--font-title);font-weight:normal;font-size:20px;}
.drawer-kepala p{margin:4px 0 0;font-size:12px;opacity:.75;}
.drawer-isi{padding:10px 12px;display:flex;flex-direction:column;gap:6px;}
.drawer-isi button,.drawer-bawah button{width:100%;text-align:left;padding:13px 14px;border-radius:10px;border:none;background:transparent;color:var(--root-deep);font-size:15px;}
.drawer-isi button:active{background:#eadfc6;}
.drawer-spacer{flex:1;}
.drawer-bawah{padding:10px 12px 0;border-top:1px solid var(--card-border);margin:0 8px;}
.drawer-bawah button{color:var(--meninggal);border:1px solid var(--card-border);background:var(--card);text-align:center;font-size:14px;}

/* ===== Kartu profil ===== */
.kartu-overlay{position:absolute;inset:0;background:rgba(24,20,13,0.62);z-index:22;display:flex;align-items:center;justify-content:center;padding:16px;}
.kartu-overlay.hidden{display:none;}
.kartu{position:relative;width:min(100%,340px);height:min(78dvh,560px);background:var(--card);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 10px 36px rgba(0,0,0,0.45);border:1px solid var(--card-border);}
.kartu-foto{flex:2 1 0;min-height:0;position:relative;background-size:cover;background-position:center 30%;background-color:#e4dabf;display:flex;align-items:center;justify-content:center;}
.kartu-foto.kosong.m{background:linear-gradient(160deg,#cfdcc8,#a9c0a6);}
.kartu-foto.kosong.f{background:linear-gradient(160deg,#ecd5c9,#d9aea0);}
.kartu-foto.kosong .inisial{font-family:var(--font-title);font-size:84px;color:rgba(36,56,43,0.65);}
.kartu-kode{position:absolute;left:12px;bottom:10px;font-size:11px;color:#fff;background:rgba(0,0,0,0.42);padding:3px 8px;border-radius:10px;}
.kartu-edit{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,250,240,0.92);color:var(--root-deep);display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 1px 6px rgba(0,0,0,0.3);}
.kartu-info{flex:1 1 0;min-height:0;overflow-y:auto;padding:12px 16px 14px;}
.kartu-nama{font-family:var(--font-title);font-size:20px;line-height:1.2;color:var(--root-deep);}
.kartu-sub{font-size:13px;color:var(--ink-soft);margin:3px 0 8px;display:flex;align-items:center;gap:6px;}
.kartu-sub .titik{width:9px;height:9px;border-radius:50%;display:inline-block;}
.kartu-sub .titik.hidup{background:var(--hidup);}
.kartu-sub .titik.meninggal{background:var(--meninggal);}
.kartu-baris{font-size:13px;line-height:1.5;color:var(--ink);margin:2px 0;}
.kartu-baris b{font-weight:normal;color:var(--ink-soft);}
.tautan{color:#1f5fd1;text-decoration:none;}
.tautan:active{text-decoration:underline;}

/* ===== Dialog konfirmasi ===== */
.dlg-overlay{position:absolute;inset:0;background:rgba(24,20,13,0.6);z-index:40;display:flex;align-items:center;justify-content:center;padding:24px;}
.dlg-overlay.hidden{display:none;}
.dlg{width:100%;max-width:320px;background:var(--card);border-radius:16px;padding:20px 18px 14px;box-shadow:0 10px 30px rgba(0,0,0,0.4);}
.dlg h3{margin:0 0 8px;font-family:var(--font-title);font-weight:normal;font-size:18px;color:var(--meninggal);}
.dlg p{margin:0 0 16px;font-size:14px;line-height:1.45;color:var(--ink);}
.dlg input{display:block;width:100%;padding:10px;border:1px solid var(--card-border);border-radius:8px;background:#fff;font-size:15px;margin-bottom:14px;color:var(--ink);}
.dlg h3.netral{color:var(--root-deep);}
.dlg-tombol button.utama{background:var(--root);border-color:var(--root);color:#fff;}
.drawer-isi button small{display:block;font-size:12px;color:var(--ink-soft);margin-top:2px;}
.dlg-tombol{display:flex;gap:10px;}
.dlg-tombol button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--card-border);background:var(--bg);font-size:14px;color:var(--root-deep);}
.dlg-tombol button.bahaya{background:var(--meninggal);border-color:var(--meninggal);color:#fff;}

@media print{
  .btn-pusat,.btn-menu,.btn-ringkasan,.drawer,.scrim,.kartu-overlay,.dlg-overlay,.pin-akar,.sheet-overlay{display:none !important;}
}

/* ===== Status pada kartu ===== */
.kartu-status{position:absolute;left:12px;top:12px;width:18px;height:18px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,0.35);}
.kartu-status.hidup{background:#2fa555;}
.kartu-status.meninggal{background:#d23a30;}

/* ===== Form alamat ===== */
.blok-alamat{border-top:1px solid var(--card-border);padding-top:10px;margin:4px 0 12px;}
.judul-blok{font-size:12px;color:var(--ink-soft);margin-bottom:8px;}
.wilayah-info{font-size:13px;color:var(--ink);display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;}
.btn-teks{border:none;background:none;color:#1f5fd1;font-size:13px;padding:4px 2px;}
.wil-status{font-size:12px;color:var(--ink-soft);margin:0 0 8px;min-height:14px;}
.modal-body input[type=checkbox]{display:inline-block;width:auto;margin:0 8px 0 0;vertical-align:middle;}
.cek-utama{display:flex;align-items:center;font-size:12px;color:var(--ink-soft);margin-bottom:12px;}
.hidden{display:none !important;}

/* ===== Crop foto ===== */
.crop-overlay{position:absolute;inset:0;z-index:25;background:#14110b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;}
.crop-overlay.hidden{display:none;}
.crop-judul{color:#f3ede0;font-size:15px;}
.crop-frame{position:relative;width:min(86vw,340px);aspect-ratio:1/1;overflow:hidden;background:#000;touch-action:none;outline:2px solid rgba(255,255,255,0.9);}
.crop-frame img{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0;user-select:none;-webkit-user-drag:none;pointer-events:none;}
.crop-grid{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to right,transparent 33.3%,rgba(255,255,255,.35) 33.3%,rgba(255,255,255,.35) calc(33.3% + 1px),transparent calc(33.3% + 1px),transparent 66.6%,rgba(255,255,255,.35) 66.6%,rgba(255,255,255,.35) calc(66.6% + 1px),transparent calc(66.6% + 1px)),linear-gradient(to bottom,transparent 33.3%,rgba(255,255,255,.35) 33.3%,rgba(255,255,255,.35) calc(33.3% + 1px),transparent calc(33.3% + 1px),transparent 66.6%,rgba(255,255,255,.35) 66.6%,rgba(255,255,255,.35) calc(66.6% + 1px),transparent calc(66.6% + 1px));}
.crop-zoom{width:min(86vw,340px);}
.crop-tombol{display:flex;gap:10px;width:min(86vw,340px);}
.crop-tombol button{flex:1;padding:12px;border-radius:10px;border:1px solid #5b5240;background:#2a2418;color:#f3ede0;font-size:14px;}
.crop-tombol button.utama{background:var(--root);border-color:var(--root);}


/* ===== Daftar akar (drawer), pin kanan atas, sheet menu ===== */
.topbar h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100% - 130px);}
.drawer-scroll{flex:1;overflow-y:auto;}
.drawer-judul{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);padding:14px 20px 6px;}
.daftar-akar{padding:0 10px;display:flex;flex-direction:column;gap:4px;}
.akar-baris{display:flex;align-items:center;gap:12px;padding:10px 8px 10px 12px;border-radius:12px;cursor:pointer;}
.akar-baris:active{background:#eadfc6;}
.akar-baris.aktif{background:#e9e0c8;}
.akar-titik{width:16px;height:16px;border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.18);}
.akar-teks{flex:1;min-width:0;}
.akar-nama{font-size:15px;color:var(--root-deep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.akar-sub{font-size:12px;color:var(--ink-soft);}
.akar-menu{flex:none;width:36px;height:36px;border:none;background:transparent;color:var(--ink-soft);font-size:20px;border-radius:50%;}
.akar-menu:active{background:#d9ceb0;}
.btn-akar-baru{margin:8px 10px 4px;width:calc(100% - 20px);padding:12px;border-radius:12px;border:1px dashed var(--card-border);background:transparent;color:var(--root);font-size:14px;text-align:center;}
.drawer-pemisah{height:1px;background:var(--card-border);margin:10px 18px;}
.pin-akar{position:absolute;right:12px;top:calc(64px + env(safe-area-inset-top,0px));z-index:12;display:flex;flex-direction:column;gap:10px;pointer-events:none;}
.pin-akar .pin{pointer-events:auto;width:42px;height:42px;border-radius:50%;border:2px solid #fff;color:#fff;font-family:var(--font-title);font-size:17px;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 2px 6px rgba(0,0,0,.3);}
.pin-akar .pin.aktif{box-shadow:0 0 0 3px var(--gold),0 2px 6px rgba(0,0,0,.3);}
.sheet-overlay{position:absolute;inset:0;background:rgba(24,20,13,.55);z-index:45;display:flex;align-items:flex-end;}
.sheet-overlay.hidden{display:none;}
.sheet{width:100%;background:var(--bg);border-radius:16px 16px 0 0;padding:14px 14px calc(16px + var(--bawah-aman));}
.sheet-judul{font-family:var(--font-title);font-size:17px;color:var(--root-deep);padding:2px 8px 10px;}
.sheet button{display:block;width:100%;text-align:left;padding:13px 10px;border:none;background:transparent;font-size:15px;color:var(--root-deep);border-radius:10px;}
.sheet button:active{background:#eadfc6;}
.sheet button.bahaya{color:var(--meninggal);}
.sheet-warna{display:flex;gap:10px;flex-wrap:wrap;padding:10px;}
.sheet-warna button{width:34px;height:34px;border-radius:50%;padding:0;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.2);}
.sheet-warna button.pilih{box-shadow:0 0 0 3px var(--gold);}


/* ===== Ringkasan generasi ===== */
.btn-ringkasan{position:absolute;left:18px;top:calc(64px + env(safe-area-inset-top,0px));z-index:12;width:38px;height:38px;border-radius:50%;border:1px solid var(--card-border);background:var(--card);color:var(--root-deep);display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 1px 4px rgba(0,0,0,0.1);}
.btn-ringkasan:active{background:#eadfc6;}
.ringkasan{width:min(100%,340px);max-height:78dvh;background:var(--card);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 10px 36px rgba(0,0,0,0.45);border:1px solid var(--card-border);}
.ringkasan-kepala{padding:16px 18px 12px;background:var(--root-deep);color:#f3ede0;}
.ringkasan-kepala h3{margin:0;font-family:var(--font-title);font-weight:normal;font-size:19px;}
.ringkasan-kepala p{margin:3px 0 0;font-size:12px;opacity:.78;}
.ringkasan-isi{padding:12px 18px 16px;overflow-y:auto;}
.rk-judul{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);margin:6px 0 6px;}
.rk-gen{margin:7px 0;}
.rk-gen-atas{display:flex;justify-content:space-between;font-size:14px;color:var(--ink);}
.rk-gen-atas b{font-weight:normal;color:var(--root-deep);}
.rk-bar{height:6px;border-radius:3px;background:#e9e0c8;margin-top:4px;overflow:hidden;}
.rk-bar i{display:block;height:100%;border-radius:3px;background:var(--root);}
.rk-pemisah{height:1px;background:var(--card-border);margin:12px 0 8px;}
.rk-baris{display:flex;justify-content:space-between;font-size:14px;margin:5px 0;color:var(--ink);}
.rk-baris span:last-child{color:var(--root-deep);}
.rk-catatan{font-size:12px;color:var(--ink-soft);margin-top:10px;line-height:1.4;}


/* ===== Status pernikahan ===== */
.line-h.cerai{background:repeating-linear-gradient(to right,var(--garis) 0,var(--garis) 6px,transparent 6px,transparent 10px);}
.label-cerai{position:absolute;transform:translateX(-50%);font-size:9px;line-height:1;color:var(--ink-soft);white-space:nowrap;pointer-events:none;font-style:italic;}
.cetak .label-cerai{font-size:13px;}
.psg-baris{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0;font-size:14px;color:var(--ink);}
.psg-baris span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.psg-baris select{width:auto;flex:none;min-width:110px;margin:0;}
.ket-cerai{color:var(--ink-soft);}


/* ===== Form edit: dua kolom, jarak aman dari bar sistem ===== */
:root{--bawah-aman:max(env(safe-area-inset-bottom,0px),44px);}
.baris-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.baris-2>label,.baris-2>.fld{min-width:0;}
.modal-body .fld{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:12px;}
.foto-ctl{margin-top:5px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;}
#previewFoto{display:flex;align-items:center;gap:8px;}
.btn-kecil.netral{color:var(--root-deep);}


/* ===== Gembok, bagikan, impor ===== */
.gembok-judul{flex:none;color:var(--ink-soft);}
.gembok-judul.hidden{display:none;}
.ikon-gembok{width:13px;height:13px;vertical-align:-1px;margin-right:5px;color:var(--ink-soft);}
.pilih-bagikan{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;font-size:14px;color:var(--ink);cursor:pointer;}
.pilih-bagikan span{display:block;}
.pilih-bagikan small{display:block;font-size:12px;color:var(--ink-soft);margin-top:2px;line-height:1.35;}
.dlg input[type=radio]{display:inline-block;width:auto;margin:3px 0 0;padding:0;flex:none;}

<script>
(async function(){
const STORAGE_KEY='akarKeluargaData';
const ROOT_ID='diri';
const NODE_W=132, GEN_H=170, NODE_H=110;
const GAP_CABANG=56;  // jarak ekstra antar cabang keluarga (seperti akar yang menyebar)
const GAP_GEN=44;     // celah dasar antar generasi
const LAJUR_H=10;     // tinggi tiap lajur garis; celah generasi melebar sesuai jumlah lajur
const CX=52; // titik tengah horizontal avatar di dalam kartu .node (lebar 104px)
const $=id=>document.getElementById(id);

function dataContoh(){
  const P=(id,nama,status,gender,jalur,ayah,ibu,psg)=>({id,nama,status,gender,jalur,foto:'',idAyah:ayah,idIbu:ibu,idPasangan:psg});
  const d={};
  [
    P('Am','Kakek (Ayah)','meninggal','m','A',null,null,['Af']),
    P('Af','Nenek (Ayah)','meninggal','f','A',null,null,['Am']),
    P('Bm','Kakek (Ibu)','meninggal','m','B',null,null,['Bf']),
    P('Bf','Nenek (Ibu)','meninggal','f','B',null,null,['Bm']),
    P('A.1m','Ayah','hidup','m','A.1','Am','Af',['B.1f']),
    P('B.1f','Ibu','hidup','f','B.1','Bm','Bf',['A.1m']),
    P('diri','Anda','hidup','m','A.1.1','A.1m','B.1f',[]),
  ].forEach(p=>d[p.id]=p);
  return {people:d};
}

// ===== Penyimpanan: IndexedDB (cadangan: localStorage) =====
const IDB_NAMA='akarKeluarga', IDB_STORE='kv', IDB_KUNCI='store', LS_STORE='akarKeluargaStore';
const WARNA_AKAR=['#3c5b45','#2f6f8f','#9a5a3c','#7a4f8f','#a97d34','#b0494f','#4a6f9e','#5f7f3d'];
const MAKS_PIN=5;
function idbBuka(){
  return new Promise((res,rej)=>{
    if(!window.indexedDB){ rej(new Error('IndexedDB tidak tersedia')); return; }
    const rq=indexedDB.open(IDB_NAMA,1);
    rq.onupgradeneeded=()=>rq.result.createObjectStore(IDB_STORE);
    rq.onsuccess=()=>res(rq.result);
    rq.onerror=()=>rej(rq.error);
  });
}
function idbBaca(db){ return new Promise((res,rej)=>{ const t=db.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).get(IDB_KUNCI); t.onsuccess=()=>res(t.result||null); t.onerror=()=>rej(t.error); }); }
function idbTulis(db,nilai){ return new Promise((res,rej)=>{ const tx=db.transaction(IDB_STORE,'readwrite'); tx.objectStore(IDB_STORE).put(nilai,IDB_KUNCI); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error); }); }
function buatAkar(id,nama,warna,dataAkar,pin){ return {id,nama,warna,pin:!!pin,data:dataAkar,dibuat:Date.now()}; }
function idAkarBaru(){ return 'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,5); }
function storeValid(st){ return st&&Array.isArray(st.akar)&&st.akar.length&&st.akar.every(a=>a&&a.data&&a.data.people&&typeof a.data.people==='object'&&Object.keys(a.data.people).length); }

let idb=null, store=null, data=null;
try{ idb=await idbBuka(); store=await idbBaca(idb); }catch(e){ idb=null; store=null; }
if(!storeValid(store)){
  store=null;
  if(!idb){ try{ const t=JSON.parse(localStorage.getItem(LS_STORE)||'null'); if(storeValid(t)) store=t; }catch(e){} }
}
if(!store){
  // migrasi dari penyimpanan lama (satu pohon di localStorage); data lama dibiarkan sebagai cadangan
  let lama=null;
  try{ lama=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null'); }catch(e){ lama=null; }
  if(!lama||!lama.people||!Object.keys(lama.people).length) lama=dataContoh();
  const nama=(typeof lama.namaKeluarga==='string'&&lama.namaKeluarga.trim())||'Keluarga Saya';
  const dataAkar={people:lama.people}; if(lama.wilayah&&typeof lama.wilayah==='object') dataAkar.wilayah=lama.wilayah;
  store={versi:2,aktifId:'a1',akar:[buatAkar('a1',nama,WARNA_AKAR[0],dataAkar,true)]};
  if(idb){ try{ await idbTulis(idb,store); }catch(e){} }
}
if(!store.akar.some(a=>a.id===store.aktifId)) store.aktifId=store.akar[0].id;
function akarAktif(){ return store.akar.find(a=>a.id===store.aktifId)||store.akar[0]; }
data=akarAktif().data;

let peringatanSimpan=false, peringatanKapasitas=false, tundaSimpan=null;
async function tulisStore(){
  tundaSimpan=null;
  try{
    if(idb){ await idbTulis(idb,store); }
    else{
      const teks=JSON.stringify(store);
      localStorage.setItem(LS_STORE,teks);
      if(teks.length>3800000 && !peringatanKapasitas){ peringatanKapasitas=true; alert('Penyimpanan app hampir penuh ('+(teks.length/1048576).toFixed(1)+' MB dari sekitar 5 MB). Lakukan Backup data sekarang dan kurangi jumlah foto bila perlu.'); }
    }
  }catch(e){ if(!peringatanSimpan){ peringatanSimpan=true; alert('Data tidak bisa disimpan otomatis di perangkat ini (penyimpanan penuh/diblokir). Gunakan Backup data secara berkala.'); } }
}
function simpanData(){ clearTimeout(tundaSimpan); tundaSimpan=setTimeout(tulisStore,250); }
function bilasSimpan(){ if(tundaSimpan){ clearTimeout(tundaSimpan); tulisStore(); } }
window.addEventListener('pagehide',bilasSimpan);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') bilasSimpan(); });
function anakDari(id){ return Object.values(data.people).filter(p=>p.idAyah===id||p.idIbu===id); }
function rootAktif(){ return data.people[ROOT_ID] ? ROOT_ID : Object.keys(data.people)[0]; }
function bacaAngka(el){ const n=parseInt(el.value,10); return isNaN(n)?null:n; }

// ===== Skema ID: <jalur><jenisKelamin>, mis. "Am"/"Af" (suami/istri leluhur "A"),
// "A.3m" (anak ke-3 dari A, laki-laki), "A.3.1f" (anak pertama dari A.3, perempuan).
// Jalur mengikuti ayah; kalau ayah tak tercatat, pakai ibu. Jalur disimpan di field `jalur`
// (data lama tanpa field itu memakai id tanpa huruf terakhir). Nomor anak ditetapkan sekali.
function pathDasar(id){ return id.slice(0,-1); }
function jalurDari(o){ return o.jalur!==undefined ? o.jalur : pathDasar(o.id); }
function genderDari(o){ return o.gender || (/[mf]$/.test(o.id) ? o.id.slice(-1) : 'm'); }
function idUnik(dasar){ let id=dasar,k=2; while(data.people[id]) id=dasar+'~'+(k++); return id; }

function hurufKeluargaBerikutnya(){
  const dipakai=new Set();
  Object.values(data.people).forEach(p=>{ const j=jalurDari(p); if(!j.includes('.')) dipakai.add(j); });
  function keHuruf(n){ let s=''; n++; while(n>0){ n--; s=String.fromCharCode(65+(n%26))+s; n=Math.floor(n/26); } return s; }
  let i=0,h; do{ h=keHuruf(i); i++; } while(dipakai.has(h));
  return h;
}
function nomorAnakBerikutnya(pathOrtu){
  const awalan=pathOrtu+'.'; let maks=0;
  Object.values(data.people).forEach(p=>{
    const j=jalurDari(p);
    if(j.startsWith(awalan)){
      const sisa=j.slice(awalan.length);
      if(/^\d+$/.test(sisa)) maks=Math.max(maks, parseInt(sisa,10));
    }
  });
  return maks+1;
}
// Umur: hidup dihitung sampai hari ini; meninggal "berhenti" di umur saat wafat (butuh minimal
// tahun wafat). Tanggal/bulan kosong dianggap 1, jadi umur bisa berupa perkiraan.
function hitungUmur(o){
  const lh=o&&o.lahir; if(!lh||!lh.tahun) return null;
  const lTahun=lh.tahun, lBulan=lh.bulan||1, lTanggal=lh.tanggal||1;
  let aTahun,aBulan,aTanggal;
  if(o.status==='meninggal'){
    const wf=o.wafat; if(!wf||!wf.tahun) return null;
    aTahun=wf.tahun; aBulan=wf.bulan||1; aTanggal=wf.tanggal||1;
  } else {
    const skrg=new Date();
    aTahun=skrg.getFullYear(); aBulan=skrg.getMonth()+1; aTanggal=skrg.getDate();
  }
  let umur=aTahun-lTahun;
  if(aBulan<lBulan || (aBulan===lBulan && aTanggal<lTanggal)) umur--;
  return umur>=0 ? umur : null;
}
function formatTglSingkat(t){
  if(!t||!t.tahun) return '';
  if(t.tanggal&&t.bulan) return `${t.tanggal}/${t.bulan}/${t.tahun}`;
  if(t.bulan) return `${t.bulan}/${t.tahun}`;
  return `${t.tahun}`;
}

// Urutan saudara memakai TANGGAL LAHIR (bukan umur): umur orang meninggal berhenti di saat wafat,
// jadi tidak bisa dipakai untuk membandingkan. Lahir kosong = paling kanan.
function kunciLahir(o){ const l=o&&o.lahir; if(!l||!l.tahun) return null; return l.tahun*10000+(l.bulan||1)*100+(l.tanggal||1); }
function bandingLahir(a,b){
  const ka=kunciLahir(a), kb=kunciLahir(b);
  if(ka===null&&kb===null) return 0;
  if(ka===null) return 1;
  if(kb===null) return -1;
  return ka-kb;
}

function hitungLayout(){
  // 1) Generasi (G) tiap orang lewat BFS dari orang utama.
  const gen={}; const antrian=[[rootAktif(),0]];
  while(antrian.length){
    const [id,g]=antrian.shift();
    if(gen[id]!==undefined) continue;
    const o=data.people[id]; if(!o) continue;
    gen[id]=g;
    if(o.idAyah) antrian.push([o.idAyah,g-1]);
    if(o.idIbu) antrian.push([o.idIbu,g-1]);
    anakDari(id).forEach(a=>antrian.push([a.id,g+1]));
    (o.idPasangan||[]).forEach(pid=>antrian.push([pid,g]));
  }
  const semuaId=Object.keys(gen);
  const genMin=Math.min(...Object.values(gen));

  // 2) Kelompokkan jadi "unit": sendiri, atau berpasangan.
  const idKeUnit={};
  {
    const sudah=new Set();
    semuaId.forEach(id=>{
      if(sudah.has(id)) return;
      const o=data.people[id];
      const pasanganId=(o.idPasangan||[]).find(pid=>semuaId.includes(pid)&&!sudah.has(pid));
      let unit;
      if(pasanganId){
        const ids=[id,pasanganId];
        if(genderDari(data.people[id])==='f' && genderDari(data.people[pasanganId])==='m') ids.reverse();
        unit={ids};
      } else unit={ids:[id]};
      unit.ids.forEach(uid=>{ idKeUnit[uid]=unit; sudah.add(uid); });
    });
  }

  function anakDariUnit(unit){
    const set=new Set();
    unit.ids.forEach(id=>anakDari(id).forEach(a=>{ if(gen[a.id]!==undefined) set.add(a.id); }));
    return [...set];
  }
  // Anak-anak sebuah unit, terurut dari TERTUA (kiri); umur tak diketahui paling kanan.
  function anakUnitTerurut(unit){
    const rawKids=anakDariUnit(unit);
    rawKids.sort((a,b)=>bandingLahir(data.people[a],data.people[b]));
    const hasil=[]; const sudahUnit=new Set();
    rawKids.forEach(id=>{
      const u=idKeUnit[id];
      if(!u||sudahUnit.has(u)) return;
      sudahUnit.add(u); hasil.push(u);
    });
    return hasil;
  }

  // 3) Urutan kiri-kanan unit "daun" lewat penelusuran dari orang utama.
  //    Aturan agar garis tidak saling menimpa: pada pasangan, keluarga asal anggota KIRI (suami)
  //    diletakkan di sisi kiri dan keluarga asal anggota KANAN (istri) di sisi kanan - jadi
  //    kedua sisi menyebar berlawanan seperti akar, tidak bersilangan. Saudara-saudara tiap
  //    orang ditaruh di sisi luar keluarganya masing-masing.
  const urutanDaun=[];
  function unitOrtu(id){
    const o=data.people[id];
    const pid=(o.idAyah&&gen[o.idAyah]!==undefined)?o.idAyah:((o.idIbu&&gen[o.idIbu]!==undefined)?o.idIbu:null);
    return pid?idKeUnit[pid]:null;
  }
  function daunDari(unit,lihat){
    lihat=lihat||new Set(); if(lihat.has(unit)) return []; lihat.add(unit);
    let hasil=[];
    anakUnitTerurut(unit).forEach(k=>{ if(k._ditempatkan) hasil=hasil.concat(daunDari(k,lihat)); });
    return hasil.length ? hasil : unit.ids.filter(id=>urutanDaun.includes(id));
  }
  function rentangUnit(unit){
    const idx=daunDari(unit).map(id=>urutanDaun.indexOf(id)).filter(i=>i>=0);
    return idx.length ? [Math.min(...idx),Math.max(...idx)] : null;
  }
  function indexAnggota(unit,pu){ // anggota unit yang merupakan anak dari pu (0 = kiri, 1 = kanan)
    const i=unit.ids.findIndex(id=>{ const o=data.people[id]; return pu.ids.includes(o.idAyah)||pu.ids.includes(o.idIbu); });
    return i<0?0:i;
  }
  function asalBelum(unit,pu){ // ada anggota lain yang keluarga asalnya belum dipasang?
    return unit.ids.some(id=>{ const q=unitOrtu(id); return q && q!==pu && !q._ditempatkan; });
  }
  // "ujung" tiap blok daun: bila di sisi sebuah daun sudah ditempel keluarga lain, tempelan
  // berikutnya diletakkan di luar tempelan sebelumnya (bukan menyelip di antaranya).
  const ujungKiri={}, ujungKanan={};
  function ikuti(peta,id){ let n=0; while(peta[id]!==undefined && n++<500) id=peta[id]; return id; }

  function tempatkanUnit(unit,idxSisip){
    if(unit._ditempatkan){
      const r=rentangUnit(unit);
      return r ? r[1]+1 : (idxSisip!=null?idxSisip:urutanDaun.length);
    }
    unit._ditempatkan=true;
    const lenAwal=urutanDaun.length;
    const awal=idxSisip!=null?idxSisip:lenAwal;
    const anak=anakUnitTerurut(unit);
    if(!anak.length){
      unit.ids.forEach((id,i)=>urutanDaun.splice(awal+i,0,id));
    } else {
      const masuk=anak.find(a=>a._ditempatkan)||null;
      const rank=a=>asalBelum(a,unit) ? (indexAnggota(a,unit)===0 ? 2 : 0) : 1; // tepi kiri / tengah / tepi kanan
      const daftar=anak.filter(a=>a!==masuk).sort((a,b)=>rank(a)-rank(b));
      const r=masuk?rentangUnit(masuk):null;
      // "masuk" = anak yang sudah ditempatkan lewat keluarga pasangannya; saudara-saudaranya
      // ditempel menempel di sisi luar pasangan itu, dan diingat sebagai blok `_blok`.
      const libre = !!(masuk && r && idxSisip!=null && indexAnggota(masuk,unit)===0 &&
        masuk.ids.every(id=>{ const q=unitOrtu(id); return !q||q===unit; }));
      let pos0;
      if(libre){
        const kidMasuk=data.people[masuk.ids[0]];
        const tepiKiri=daftar.filter(a=>rank(a)===0), tepiKanan=daftar.filter(a=>rank(a)===2);
        const tengah=daftar.filter(a=>rank(a)===1);
        const tua=tengah.filter(a=>bandingLahir(data.people[a.ids[indexAnggota(a,unit)]],kidMasuk)<0);
        const muda=tengah.filter(a=>tua.indexOf(a)<0);
        let ps=r[0];
        tepiKiri.concat(tua).forEach(a=>{ const nx=tempatkanUnit(a,ps); ps=Math.max(ps,nx); });
        const r2=rentangUnit(masuk); ps=r2?r2[1]+1:ps;
        muda.concat(tepiKanan).forEach(a=>{ const nx=tempatkanUnit(a,ps); ps=Math.max(ps,nx); });
        unit._urutAnak=tepiKiri.concat(tua,[masuk],muda,tepiKanan);
      } else {
      pos0 = (masuk && r && idxSisip==null)
        ? (indexAnggota(masuk,unit)===0 ? r[0] : r[1]+1)
        : awal;
      let pos=pos0; const lenSebelum=urutanDaun.length;
      daftar.forEach(a=>{ const nx=tempatkanUnit(a,pos); pos=Math.max(pos,nx); });
      const cnt=urutanDaun.length-lenSebelum;
      if(masuk && cnt>0) unit._blok=[urutanDaun[pos0],urutanDaun[pos0+cnt-1]];
      // urutan kiri-kanan anak (dipakai untuk menyusun urutan unit di tiap generasi)
      unit._urutAnak = masuk ? (indexAnggota(masuk,unit)===0 ? daftar.concat([masuk]) : [masuk].concat(daftar)) : daftar.slice();
      }
    }
    // Pasang keluarga asal tiap anggota: anggota KIRI di sisi kiri blok, anggota KANAN di sisi kanan.
    unit.ids.forEach((id,i)=>{
      const q=unitOrtu(id); if(!q||q._ditempatkan) return;
      let blok=unit._blok;
      if(!blok){ const r=rentangUnit(unit); if(!r) return; blok=[urutanDaun[r[0]],urutanDaun[r[1]]]; }
      const sebelum=urutanDaun.length;
      if(i===0){
        const pos=urutanDaun.indexOf(ikuti(ujungKiri,blok[0]));
        tempatkanUnit(q,pos);
        if(urutanDaun.length>sebelum) ujungKiri[blok[0]]=urutanDaun[pos];
      } else {
        const pos=urutanDaun.indexOf(ikuti(ujungKanan,blok[1]))+1;
        tempatkanUnit(q,pos);
        const cnt=urutanDaun.length-sebelum;
        if(cnt>0) ujungKanan[blok[1]]=urutanDaun[pos+cnt-1];
      }
    });
    return awal+(urutanDaun.length-lenAwal);
  }

  const unitUnik=[...new Set(Object.values(idKeUnit))];
  // kunci keluarga tiap unit (orang tua dari anggota yang punya orang tua tercatat)
  unitUnik.forEach(u=>{
    const pid=u.ids.find(id=>{ const o=data.people[id]; return o.idAyah||o.idIbu; });
    u._kunci = pid ? (data.people[pid].idAyah||'')+'|'+(data.people[pid].idIbu||'') : 'solo:'+u.ids[0];
  });
  tempatkanUnit(idKeUnit[rootAktif()],null);
  unitUnik.forEach(u=>{ if(!u._ditempatkan) tempatkanUnit(u,null); }); // sisa yang tak terhubung lewat jalur utama
  unitUnik.forEach(u=>{ u._rentang=rentangUnit(u); });

  const idealDaun={}; let kursor=0, kunciSebelum=null;
  urutanDaun.forEach(id=>{
    const k=idKeUnit[id]._kunci;
    if(kunciSebelum!==null && k!==kunciSebelum) kursor+=GAP_CABANG;
    idealDaun[id]=kursor; kursor+=NODE_W; kunciSebelum=k;
  });

  // 4) X akhir per generasi dari bawah ke atas. Unit ber-keturunan di tengah anak kandungnya;
  //    unit daun di posisi ideal. Bertabrakan -> digeser supaya kartu tidak bertumpuk.
  const x={};
  const perGen={};
  unitUnik.forEach(u=>{
    const g=Math.max(...u.ids.map(id=>gen[id]));
    (perGen[g]=perGen[g]||[]).push(u);
  });
  // Urutan unit di tiap generasi diturunkan dari generasi di atasnya (anak-anak tiap keluarga,
  // kiri ke kanan, sesuai penempatan sisi suami/istri), jadi garis ke atas tidak bersilangan.
  const urutGen={};
  {
    const gAsc=Object.keys(perGen).map(Number).sort((a,b)=>a-b);
    const mulaiR=u=>u._rentang?u._rentang[0]:0;
    const akhirR=u=>u._rentang?u._rentang[1]:0;
    gAsc.forEach((g,gi)=>{
      const lihat=new Set(); const hasil=[];
      if(gi>0) (urutGen[gAsc[gi-1]]||[]).forEach(P=>(P._urutAnak||[]).forEach(k=>{
        if(perGen[g].includes(k) && !lihat.has(k)){ lihat.add(k); hasil.push(k); }
      }));
      perGen[g].filter(u=>!lihat.has(u)).sort((a,b)=>mulaiR(a)-mulaiR(b)||akhirR(a)-akhirR(b)).forEach(u=>{
        const i=hasil.findIndex(h=>mulaiR(h)>mulaiR(u));
        if(i<0) hasil.push(u); else hasil.splice(i,0,u);
      });
      urutGen[g]=hasil;
    });
  }
  Object.keys(perGen).map(Number).sort((a,b)=>b-a).forEach(g=>{
    const units=urutGen[g]||perGen[g];
    let prevEnd=-Infinity, prevKunci=null;
    units.forEach(u=>{
      let tengah;
      if(idealDaun[u.ids[0]]!==undefined){
        tengah = idealDaun[u.ids[0]] + (u.ids.length-1)*NODE_W/2;
      } else {
        const rawKids=anakDariUnit(u).filter(id=>x[id]!==undefined);
        tengah = rawKids.length ? rawKids.reduce((s,id)=>s+x[id],0)/rawKids.length : 0;
      }
      const lebar=u.ids.length*NODE_W;
      let startX=tengah-(lebar-NODE_W)/2;
      const minStart=prevEnd+((prevKunci!==null && prevKunci!==u._kunci)?GAP_CABANG:0);
      if(startX<minStart) startX=minStart;
      u.ids.forEach((id,i)=>{ x[id]=startX+i*NODE_W; });
      prevEnd=startX+lebar; prevKunci=u._kunci;
    });
  });

  const minX=Math.min(...Object.values(x));
  Object.keys(x).forEach(id=>{ x[id]-=minX; });

  const posisi={};
  semuaId.forEach(id=>{ posisi[id] = { x:x[id], y:(gen[id]-genMin)*GEN_H, gen:gen[id] }; });
  return posisi;
}

function inisial(nama){ return (nama||'?').trim().split(/\s+/).filter(w=>/^[A-Za-z\u00C0-\u024F]/.test(w)).slice(0,2).map(w=>w[0]).join('').toUpperCase() || '?'; }

let contentW=0, contentH=0;

// Metrik gambar: layar memakai ukuran biasa; cetak memakai lingkaran & teks lebih besar.
const M_LAYAR={NODE_H:110,CX:52,CY:29,T:2,cetak:false};
const M_CETAK={NODE_H:176,CX:62,CY:44,T:3,cetak:true};
function garisV(tg,x,y1,y2,T){
  const d=document.createElement('div'); d.className='line line-v';
  d.style.cssText=`left:${x-T/2}px;top:${Math.min(y1,y2)}px;height:${Math.abs(y2-y1)}px;width:${T}px`;
  tg.appendChild(d);
}
function garisH(tg,x1,y,x2,T,kelas){
  const d=document.createElement('div'); d.className='line line-h'+(kelas?' '+kelas:'');
  d.style.cssText=`left:${Math.min(x1,x2)-T/2}px;top:${y-T/2}px;width:${Math.abs(x2-x1)+T}px;height:${T}px`;
  tg.appendChild(d);
}

function gambarPohon(target,M){
  const posisi=hitungLayout();
  target.innerHTML='';

  // 1) kelompokkan anak per keluarga (pasangan orang tua yang sama)
  const keluarga={};
  Object.values(data.people).forEach(o=>{
    const pos=posisi[o.id]; if(!pos) return;
    const ids=[o.idAyah,o.idIbu].filter(id=>id&&posisi[id]);
    if(!ids.length) return;
    const kunci=ids.join('|');
    (keluarga[kunci]=keluarga[kunci]||{ids,anak:[]}).anak.push(pos);
  });
  const perGenAnak={};
  Object.values(keluarga).forEach(f=>{
    const ortu=f.ids.map(id=>posisi[id]);
    const ayahO=data.people[f.ids[0]];
    f.rapat=ortu.length===2 && ortu[0].gen===ortu[1].gen && (ayahO.idPasangan||[]).includes(f.ids[1]);
    f.midX=f.rapat ? (ortu[0].x+ortu[1].x)/2+M.CX : ortu[0].x+M.CX;
    const xs=f.anak.map(p=>p.x+M.CX).concat(f.midX);
    f.kiri=Math.min(...xs); f.kanan=Math.max(...xs);
    f.gen=f.anak[0].gen;
    (perGenAnak[f.gen]=perGenAnak[f.gen]||[]).push(f);
  });
  // 2) tiap keluarga di satu generasi dapat lajur sendiri bila rentang garisnya beririsan
  const jumlahLajur={};
  Object.keys(perGenAnak).forEach(g=>{
    const fams=perGenAnak[g];
    fams.sort((a,b)=>a.kiri-b.kiri||a.kanan-b.kanan);
    const lajur=[];
    fams.forEach(f=>{
      let k=lajur.findIndex(r=>f.kiri>r+8);
      if(k<0){ k=lajur.length; lajur.push(-Infinity); }
      lajur[k]=f.kanan; f.lajur=k;
    });
    jumlahLajur[g]=lajur.length;
  });
  // 3) tinggi tiap generasi: celah ke bawah melebar sesuai jumlah lajur yang dibutuhkan
  const daftarGen=[...new Set(Object.values(posisi).map(p=>p.gen))].sort((a,b)=>a-b);
  const yGen={}; let yy=0;
  daftarGen.forEach((g,i)=>{ if(i>0) yy+=M.NODE_H+GAP_GEN+(jumlahLajur[g]||0)*LAJUR_H; yGen[g]=yy; });
  Object.values(posisi).forEach(p=>{ p.y=yGen[p.gen]; });

  // 4) gambar garis: pasangan, lalu tiap keluarga (satu garis per keluarga)
  Object.values(data.people).forEach(o=>{
    const pos=posisi[o.id]; if(!pos) return;
    (o.idPasangan||[]).forEach(pid=>{
      const pos2=posisi[pid];
      if(pos2 && pid>o.id){
        const cerai=((o.statusPasangan||{})[pid]==='cerai');
        garisH(target,pos.x+M.CX,pos.y+M.CY,pos2.x+M.CX,M.T,cerai?'cerai':'');
        if(cerai){
          const lb=document.createElement('div'); lb.className='label-cerai'; lb.textContent='cerai';
          lb.style.left=((pos.x+pos2.x)/2+M.CX)+'px'; lb.style.top=(pos.y+M.CY-M.T-(M.cetak?16:11))+'px';
          target.appendChild(lb);
        }
      }
    });
  });
  Object.values(keluarga).forEach(f=>{
    const ortu=f.ids.map(id=>posisi[id]);
    const yMulai=f.rapat ? ortu[0].y+M.CY : ortu[0].y+M.NODE_H;
    const yBus=f.anak[0].y-12-f.lajur*LAJUR_H;
    garisV(target,f.midX,yMulai,yBus,M.T);
    if(f.kanan>f.kiri) garisH(target,f.kiri,yBus,f.kanan,M.T);
    f.anak.forEach(p=>garisV(target,p.x+M.CX,yBus,p.y,M.T));
  });

  let maksX=0,maksY=0;
  Object.values(data.people).forEach(o=>{
    const pos=posisi[o.id]; if(!pos) return;
    maksX=Math.max(maksX,pos.x+NODE_W); maksY=Math.max(maksY,pos.y+M.NODE_H);

    const n=document.createElement('div');
    n.className='node'+((!M.cetak&&o.id===rootAktif())?' aktif':'');
    n.dataset.id=o.id;
    n.style.left=pos.x+'px'; n.style.top=pos.y+'px';

    const wrap=document.createElement('div'); wrap.className='avatar-wrap';
    const av=document.createElement('div'); av.className='avatar';
    if(o.foto) av.style.backgroundImage=`url("${o.foto}")`; else av.textContent=inisial(o.nama);
    const dot=document.createElement('div'); dot.className='status-dot '+(o.status==='meninggal'?'meninggal':'hidup');
    wrap.appendChild(av); wrap.appendChild(dot);

    const nm=document.createElement('div'); nm.className='nama'+(o.nama?'':' kosong'); nm.textContent=o.nama||'Tanpa nama';
    const um=document.createElement('div'); um.className='umur';
    const u=hitungUmur(o);
    um.textContent = u!==null ? (u+' th'+(o.status==='meninggal'?' †':'')) : formatTglSingkat(o.lahir);

    n.appendChild(wrap); n.appendChild(nm); n.appendChild(um);
    target.appendChild(n);
  });
  return {w:maksX,h:maksY};
}
function render(pasKeLayarJuga){
  const u=gambarPohon(canvas,M_LAYAR);
  contentW=u.w; contentH=u.h;
  canvas.style.width=contentW+'px'; canvas.style.height=contentH+'px';
  if(pasKeLayarJuga) pasKeLayar(); else pasangTransform();
}

// ===== Pan & zoom =====
let tx=0,ty=0,sk=1;
function pasangTransform(){ canvas.style.transform=`translate(${tx}px,${ty}px) scale(${sk})`; }
function pasKeLayar(){
  const vp=viewport.getBoundingClientRect();
  sk=Math.min(1,(vp.width-24)/Math.max(contentW,1),(vp.height-130)/Math.max(contentH,1));
  sk=Math.max(sk,0.15);
  tx=(vp.width-contentW*sk)/2;
  ty=70+Math.max(0,(vp.height-130-contentH*sk)/2);
  pasangTransform();
}
function zoomDi(cx,cy,skBaru){
  skBaru=Math.min(2.5,Math.max(0.15,skBaru));
  const r=skBaru/sk;
  tx=cx-(cx-tx)*r; ty=cy-(cy-ty)*r; sk=skBaru;
  pasangTransform();
}

const pointer=new Map();
let tap=null, jarakAwal=0, skAwal=1, geserTerakhir=false, blokirKlikSampai=0;
function titikTengahDua(){
  const [a,b]=[...pointer.values()];
  return {x:(a.x+b.x)/2,y:(a.y+b.y)/2,d:Math.hypot(a.x-b.x,a.y-b.y)};
}
viewport.addEventListener('pointerdown',e=>{
  const r=viewport.getBoundingClientRect();
  pointer.set(e.pointerId,{x:e.clientX-r.left,y:e.clientY-r.top});
  if(pointer.size===1){ tap={x:e.clientX,y:e.clientY,gerak:false}; geserTerakhir=false; }
  else { geserTerakhir=true; if(tap) tap.gerak=true; const t=titikTengahDua(); jarakAwal=t.d||1; skAwal=sk; }
  tutupFab();
});
viewport.addEventListener('pointermove',e=>{
  if(!pointer.has(e.pointerId)) return;
  const r=viewport.getBoundingClientRect();
  const lama=pointer.get(e.pointerId);
  const baru={x:e.clientX-r.left,y:e.clientY-r.top};
  pointer.set(e.pointerId,baru);
  if(pointer.size===1){
    if(tap && !tap.gerak && Math.hypot(e.clientX-tap.x,e.clientY-tap.y)>8){ tap.gerak=true; geserTerakhir=true; }
    if(tap && tap.gerak){ tx+=baru.x-lama.x; ty+=baru.y-lama.y; pasangTransform(); }
  } else if(pointer.size===2){
    const t=titikTengahDua();
    zoomDi(t.x,t.y,skAwal*(t.d/jarakAwal));
  }
});
function selesaiPointer(e){
  pointer.delete(e.pointerId);
  if(pointer.size===1 && tap){ tap.gerak=true; geserTerakhir=true; } // dari 2 jari ke 1 jari: jangan loncat
  if(pointer.size===0) tap=null;
}
// Modal dibuka dari event 'click' (SESUDAH jari terangkat) supaya ketukan yang sama tidak
// "tembus" ke isi modal yang baru muncul di bawah jari (mis. membuka pilihan Status/Ayah/Ibu).
viewport.addEventListener('click',e=>{
  if(geserTerakhir || Date.now()<blokirKlikSampai) return;
  const n=e.target.closest ? e.target.closest('.node') : null;
  if(n) bukaKartu(n.dataset.id);
});
viewport.addEventListener('pointerup',selesaiPointer);
viewport.addEventListener('pointercancel',selesaiPointer);
viewport.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=viewport.getBoundingClientRect();
  zoomDi(e.clientX-r.left,e.clientY-r.top,sk*(e.deltaY<0?1.1:1/1.1));
},{passive:false});
window.addEventListener('resize',()=>{ if(!$('modalOverlay').classList.contains('hidden')) return; pasKeLayar(); });

async function kirimBerkas(isi,namaFile,judulBagikan,dialogTitle,mime){
  const cap=window.Capacitor;
  const plg=cap&&cap.Plugins;
  if(cap&&cap.isNativePlatform&&cap.isNativePlatform()&&plg&&plg.Filesystem&&plg.Share){
    try{
      const r=await plg.Filesystem.writeFile({path:namaFile,data:isi,directory:'CACHE',encoding:'utf8'});
      await plg.Share.share({title:judulBagikan,dialogTitle:dialogTitle,files:[r.uri]});
    }catch(err){
      const m=String((err&&err.message)||err||'');
      if(!/cancel|dismiss/i.test(m)) alert('Gagal membagikan: '+m);
    }
    return;
  }
  const blob=new Blob([isi],{type:mime||'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=namaFile;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}
function stempelTanggal(){ const t=new Date(); const p=n=>String(n).padStart(2,'0'); return `${t.getFullYear()}${p(t.getMonth()+1)}${p(t.getDate())}`; }
$('btnBackup').addEventListener('click',async()=>{

function normalisasiPeople(people){
  Object.keys(people).forEach(k=>{
    const p=people[k]; if(!p||typeof p!=='object') throw new Error('format');
    p.id=p.id||k; p.idPasangan=p.idPasangan||[]; p.idAyah=p.idAyah||null; p.idIbu=p.idIbu||null; p.foto=p.foto||''; p.nama=p.nama||'';
  });
}
$('inputRestore').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(d&&Array.isArray(d.akar)&&d.akar.length){
        const daftar=d.akar.map((a,i)=>{
          if(!a||!a.data||typeof a.data.people!=='object'||!Object.keys(a.data.people).length) throw new Error('format');
          normalisasiPeople(a.data.people);
          const dataAkar={people:a.data.people}; if(a.data.wilayah&&typeof a.data.wilayah==='object') dataAkar.wilayah=a.data.wilayah;
          return {id:String(a.id||idAkarBaru()),nama:String(a.nama||('Akar '+(i+1))),warna:a.warna||WARNA_AKAR[i%WARNA_AKAR.length],pin:!!a.pin,data:dataAkar,dibuat:a.dibuat||Date.now(),pemilikId:a.pemilikId||'',pemilikNama:a.pemilikNama||'',terkunci:!!a.terkunci,asalId:a.asalId||'',mode:a.mode||''};
        });
        if(!confirm('Semua akar saat ini ('+store.akar.length+') akan diganti dengan isi file backup ('+daftar.length+' akar). Lanjutkan?')) return;
        const lamaPengguna=store.pengguna;
        store={versi:2,aktifId:daftar.some(a=>a.id===d.aktifId)?d.aktifId:daftar[0].id,akar:daftar,pengguna:(d.pengguna&&d.pengguna.id&&d.pengguna.nama)?{id:String(d.pengguna.id),nama:String(d.pengguna.nama)}:lamaPengguna};
        if(store.pengguna) store.akar.forEach(a=>{ if(!a.pemilikId&&!a.terkunci){ a.pemilikId=store.pengguna.id; a.pemilikNama=store.pengguna.nama; } });
        data=akarAktif().data;
      } else {
        if(!d||typeof d.people!=='object'||!Object.keys(d.people).length) throw new Error('format');
        normalisasiPeople(d.people);
        if(akarAktif().terkunci){ alert('Akar ini terkunci (hasil impor) dan tidak bisa diganti lewat Restore.'); return; }
        if(!confirm('Data akar "'+akarAktif().nama+'" akan diganti dengan isi file backup. Lanjutkan?')) return;
        const a=akarAktif();
        a.data={people:d.people}; if(d.wilayah&&typeof d.wilayah==='object') a.data.wilayah=d.wilayah;
        if(typeof d.namaKeluarga==='string'&&d.namaKeluarga.trim()) a.nama=d.namaKeluarga.trim();
        data=a.data;
      }
      simpanData(); tutupKartu(); perbaruiJudul(); segarkanDaftarAkar(); segarkanPin(); render(true);
    }catch(err){ alert('File backup tidak valid.'); }
  };
  r.readAsText(f);
});

const KERTAS=[['A4',210,297],['A3',297,420],['A2',420,594],['A1',594,841],['A0',841,1189]];
function pilihKertas(w,h){
  const mm=96/25.4;
  const land=w>=h;
  let pilih=null;
  for(const [nama,a,b] of KERTAS){
    const pw=(land?b:a)*mm, ph=(land?a:b)*mm;
    const fit=Math.min(pw/w,ph/h);
    pilih={paper:nama,landscape:land,fit};
    if(fit>=1) break;
  }
  pilih.zoom=Math.min(pilih.fit*0.97,1.4);
  return pilih;
}
$('btnCetak').addEventListener('click',async()=>{
  tutupFab();
  const u=gambarPohon($('cetakCanvas'),M_CETAK);
  $('cetakCanvas').style.width=u.w+'px'; $('cetakCanvas').style.height=u.h+'px';
  const PAD=64;
  const judul=(akarAktif().nama||'').trim();
  const W=Math.max(u.w,1)+2*PAD;
  const fs=Math.max(26,Math.min(56,(W-2*PAD)/(Math.max(judul.length,1)*0.62)));
  const jd=$('cetakJudul');
  jd.textContent=judul; jd.style.display=judul?'block':'none';
  jd.style.fontSize=fs+'px'; jd.style.marginBottom='44px';
  const judulH=judul?Math.ceil(fs*1.25)+44:0;
  const H=Math.max(u.h,1)+2*PAD+judulH;
  const wrap=$('cetakWrap');
  wrap.style.width=W+'px'; wrap.style.padding=PAD+'px';
  const k=pilihKertas(W,H);
  document.documentElement.style.setProperty('--pzc',k.zoom);
  const cap=window.Capacitor;
  const native=!!(cap&&cap.isNativePlatform&&cap.isNativePlatform());
  if(native){
    const jembatan=cap.Plugins&&cap.Plugins.AkarPrint;
    if(!jembatan){ alert('Cetak gagal: jembatan cetak tidak terdaftar di app ini.'); return; }
    try{ await jembatan.print({name:'Akar Keluarga',paper:k.paper,landscape:k.landscape}); }
    catch(err){ alert('Cetak gagal: '+((err&&err.message)||err)); }
    return;
  }
  window.print();
});

function hurufPin(nama){
  const inti=String(nama||'').replace(/^\s*(keluarga|kel\.?|keturunan)\s+/i,'');

  return m?m[0].toUpperCase():'?';
}

// ===== Ringkasan generasi =====
function ringkasanTerbuka(){ return !$('ringkasanOverlay').classList.contains('hidden'); }
function tutupRingkasan(){ $('ringkasanOverlay').classList.add('hidden'); }
function bukaRingkasan(){
  const a=akarAktif();
  const posisi=hitungLayout();
  const ids=Object.keys(posisi);
  const genMin=Math.min(...ids.map(id=>posisi[id].gen));
  const perGen={};
  ids.forEach(id=>{ const g=posisi[id].gen-genMin+1; (perGen[g]=perGen[g]||[]).push(data.people[id]); });
  const daftarGen=Object.keys(perGen).map(Number).sort((x,y)=>x-y);
  const maks=Math.max(...daftarGen.map(g=>perGen[g].length));
  const semua=ids.map(id=>data.people[id]);
  const hidup=semua.filter(o=>o.status!=='meninggal').length;
  const laki=semua.filter(o=>genderDari(o)!=='f').length;
  const terlepas=Object.keys(data.people).length-ids.length;
  let h='<div class="rk-judul">Per generasi</div>';
  daftarGen.forEach(g=>{
    const n=perGen[g].length;
    h+=`<div class="rk-gen"><div class="rk-gen-atas"><span>Generasi ${g}${g===1?' (leluhur tertua)':''}</span><b>${n} orang</b></div><div class="rk-bar"><i style="width:${Math.round(n/maks*100)}%"></i></div></div>`;
  });
  h+='<div class="rk-pemisah"></div>';
  h+=`<div class="rk-baris"><span>Total</span><span>${semua.length} orang</span></div>`;
  h+=`<div class="rk-baris"><span>Hidup</span><span>${hidup}</span></div>`;
  h+=`<div class="rk-baris"><span>Meninggal</span><span>${semua.length-hidup}</span></div>`;
  h+=`<div class="rk-baris"><span>Laki-laki</span><span>${laki}</span></div>`;
  h+=`<div class="rk-baris"><span>Perempuan</span><span>${semua.length-laki}</span></div>`;
  h+=`<div class="rk-baris"><span>Jumlah generasi</span><span>${daftarGen.length}</span></div>`;
  if(terlepas>0) h+=`<div class="rk-catatan">${terlepas} orang belum tersambung ke pohon ini, jadi tidak ikut dihitung.</div>`;
  $('rkAkar').textContent=a.nama;
  $('rkIsi').innerHTML=h; $('rkIsi').scrollTop=0;
  $('ringkasanOverlay').classList.remove('hidden');
}
$('btnRingkasan').addEventListener('click',()=>{ tutupFab(); bukaRingkasan(); });

function bangunBerkasAkar(akar,mode){
  const people={};
  Object.values(akar.data.people).forEach(o=>{
    const c=JSON.parse(JSON.stringify(o));
    if(mode==='dasar'&&c.status!=='meninggal'){
      c.foto=''; delete c.alamat;
      if(c.lahir){ if(c.lahir.tahun) c.lahir={tahun:c.lahir.tahun}; else delete c.lahir; }
    }
    people[c.id]=c;
  });
  const d={people}; if(mode==='lengkap'&&akar.data.wilayah) d.wilayah=akar.data.wilayah;
  return {format:'akar-keluarga-akar',versi:2,pengirim:{id:store.pengguna.id,nama:store.pengguna.nama},akar:{id:akar.id,nama:akar.nama,warna:akar.warna,mode,diubah:Date.now(),data:d}};
}
$('bagikanYa').addEventListener('click',async()=>{
  const a=store.akar.find(x=>x.id===bagikanId); if(!a) return;
  const mode=document.querySelector('input[name="modeBagikan"]:checked').value;
  tutupBagikan();
  const isi=JSON.stringify(bangunBerkasAkar(a,mode));

async function imporBerkas(teks){

  const pengirim=String(d.pengirim.nama||'pengirim');

    if(!ya) return;
  } else {
    const ada=store.akar.find(a=>a.terkunci&&a.asalId===String(d.akar.id)&&a.pemilikId===String(d.pengirim.id));
    if(ada){

      if(!ya) return;

      gantiAkar(ada.id); simpanData(); tutupDrawer();
      alert('Akar "'+ada.nama+'" diperbarui.');
      return;
    }
  }
  const pakai=new Set(store.akar.map(a=>a.warna));
  const warna=WARNA_AKAR.find(w=>!pakai.has(w))||WARNA_AKAR[store.akar.length%WARNA_AKAR.length];
  const nama=pengirim+' \u00b7 '+String(d.akar.nama||'Akar');
  const baru=buatAkar(idAkarBaru(),nama,warna,dataAkar,store.akar.filter(a=>a.pin).length<MAKS_PIN);

  store.akar.push(baru);
  gantiAkar(baru.id); simpanData(); tutupDrawer();

}

let kartuId=null;
function esc(t){ return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function tautanOrang(id){ const o=data.people[id]; return o ? `<a href="#" class="tautan" data-id="${esc(id)}">${esc(o.nama||'Tanpa nama')}</a>` : ''; }
function urutLahir(a,b){
  const ya=(a.lahir&&a.lahir.tahun)||9999, yb=(b.lahir&&b.lahir.tahun)||9999;
  return ya-yb || String(a.nama||'').localeCompare(String(b.nama||''));

function barisRelasi(label,ids){
  const t=ids.map(tautanOrang).filter(Boolean);

function barisAnak(o){

    if(a.length) grup.push({pid,anak:a});
  });
  const dipakai=new Set(grup.flatMap(g=>g.anak.map(c=>c.id)));

const WIL_URL='https://www.emsifa.com/api-wilayah-indonesia/v2';
const wilMem={};
async function wilAmbil(path){
  if(wilMem[path]) return wilMem[path];
  const kunci='wil:'+path;
  try{ const c=localStorage.getItem(kunci); if(c){ wilMem[path]=JSON.parse(c); return wilMem[path]; } }catch(e){}
  const r=await fetch(`${WIL_URL}/${path}.json`);
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j=await r.json();
  const arr=(Array.isArray(j.data)?j.data:[]).map(x=>({id:String(x.id),name:String(x.name)}));
  if(!arr.length) throw new Error('kosong');
  wilMem[path]=arr;
  try{ localStorage.setItem(kunci,JSON.stringify(arr)); }catch(e){}
  return arr;
}

// ===== Crop foto =====
const FOTO_PX=480;
let cropIm=null, cropUrl='', cropS=1, cropMin=1, cropX=0, cropY=0, cropF=300;
const cropPtr=new Map(); let cropJarak=0, cropSAwal=1;
function cropTerbuka(){ return !$('cropOverlay').classList.contains('hidden'); }
function cropTerapkan(){
  const el=$('cropImg');
  el.style.transform=`translate(${cropX}px,${cropY}px) scale(${cropS})`;
  $('cropZoom').value=cropS/cropMin;
}
function cropBatasi(){
  const iw=cropIm.naturalWidth, ih=cropIm.naturalHeight;
  cropS=Math.min(cropMin*5,Math.max(cropMin,cropS));
  cropX=Math.min(0,Math.max(cropF-iw*cropS,cropX));
  cropY=Math.min(0,Math.max(cropF-ih*cropS,cropY));
}
function cropZoomDi(px,py,sBaru){
  const r=Math.min(cropMin*5,Math.max(cropMin,sBaru))/cropS;
  cropX=px-(px-cropX)*r; cropY=py-(py-cropY)*r; cropS*=r;
  cropBatasi(); cropTerapkan();
}
function bukaCrop(file){
  const url=URL.createObjectURL(file);
  const im=new Image();
  im.onload=()=>{
    if(!im.naturalWidth){ URL.revokeObjectURL(url); alert('Foto tidak bisa dibaca.'); return; }
    cropIm=im; cropUrl=url;
    const el=$('cropImg'); el.src=url; el.style.width=im.naturalWidth+'px'; el.style.height=im.naturalHeight+'px';
    $('cropOverlay').classList.remove('hidden');
    cropF=$('cropFrame').clientWidth||300;
    cropMin=cropF/Math.min(im.naturalWidth,im.naturalHeight);
    cropS=cropMin;
    cropX=(cropF-im.naturalWidth*cropS)/2; cropY=(cropF-im.naturalHeight*cropS)/2;
    cropBatasi(); cropTerapkan();
  };
  im.onerror=()=>{ URL.revokeObjectURL(url); alert('Foto tidak bisa dibaca.'); };
  im.src=url;
}
function tutupCrop(){
  $('cropOverlay').classList.add('hidden');
  if(cropUrl){ URL.revokeObjectURL(cropUrl); cropUrl=''; }
  cropIm=null; cropPtr.clear(); $('cropImg').removeAttribute('src');
  $('fFotoFile').value='';
}
$('fFotoFile').addEventListener('change',e=>{ const f=e.target.files[0]; if(f) bukaCrop(f); });
$('btnPilihFoto').addEventListener('click',()=>$('fFotoFile').click());
$('cropBatal').addEventListener('click',tutupCrop);
$('cropPakai').addEventListener('click',()=>{
  if(!cropIm) return;
  const c=document.createElement('canvas'); c.width=FOTO_PX; c.height=FOTO_PX;
  const g=c.getContext('2d'); g.imageSmoothingQuality='high';
  g.drawImage(cropIm,-cropX/cropS,-cropY/cropS,cropF/cropS,cropF/cropS,0,0,FOTO_PX,FOTO_PX);
  fotoTemp=c.toDataURL('image/jpeg',0.8); segarkanFoto(); tutupCrop();
});
$('cropZoom').addEventListener('input',e=>{ if(cropIm) cropZoomDi(cropF/2,cropF/2,cropMin*parseFloat(e.target.value)); });
(function(){
  const fr=$('cropFrame');
  function titik(e){ const r=fr.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
  fr.addEventListener('pointerdown',e=>{
    if(!cropIm) return;
    fr.setPointerCapture&&fr.setPointerCapture(e.pointerId);
    cropPtr.set(e.pointerId,titik(e));
    if(cropPtr.size===2){ const [a,b]=[...cropPtr.values()]; cropJarak=Math.hypot(a.x-b.x,a.y-b.y)||1; cropSAwal=cropS; }
  });
  fr.addEventListener('pointermove',e=>{
    if(!cropIm||!cropPtr.has(e.pointerId)) return;
    const lama=cropPtr.get(e.pointerId), baru=titik(e);
    cropPtr.set(e.pointerId,baru);
    if(cropPtr.size===1){ cropX+=baru.x-lama.x; cropY+=baru.y-lama.y; cropBatasi(); cropTerapkan(); }
    else if(cropPtr.size===2){
      const [a,b]=[...cropPtr.values()];
      const d=Math.hypot(a.x-b.x,a.y-b.y)||1;
      cropZoomDi((a.x+b.x)/2,(a.y+b.y)/2,cropSAwal*(d/cropJarak));
    }
  });
  const lepas=e=>{ cropPtr.delete(e.pointerId); };
  fr.addEventListener('pointerup',lepas); fr.addEventListener('pointercancel',lepas);
  fr.addEventListener('wheel',e=>{ if(!cropIm) return; e.preventDefault(); const t=titik(e); cropZoomDi(t.x,t.y,cropS*(e.deltaY<0?1.1:1/1.1)); },{passive:false});
})();

function bacaTanggal(t,b,y){
  const tahun=bacaAngka(y); if(!tahun) return null;
  const tg=bacaAngka(t), bl=bacaAngka(b);
  const out={tahun};
  if(bl>=1&&bl<=12){ out.bulan=bl; if(tg>=1&&tg<=31) out.tanggal=tg; }
  return out;
}
// Terapkan isi form ke data (dipakai Simpan, dan otomatis sebelum menambah anggota
// supaya ketikan yang belum disimpan tidak hilang).
function terapkanForm(o){
  o.nama=$('fNama').value.trim();
  o.status=$('fStatus').value;
  const gBaru=$('fGender').value, gLama=genderDari(o);
  o.gender=gBaru; o.foto=fotoTemp;
  simpanAlamat(o);
  terapkanStatusPasangan(o);
  const lh=bacaTanggal($('fLahirTgl'),$('fLahirBln'),$('fLahirThn'));
  if(lh) o.lahir=lh; else delete o.lahir;
  const wf=o.status==='meninggal' ? bacaTanggal($('fWafatTgl'),$('fWafatBln'),$('fWafatThn')) : null;
  if(wf) o.wafat=wf; else delete o.wafat;
  const ay=$('fAyah').value||null, ib=$('fIbu').value||null;
  o.idAyah=ay; o.idIbu=(ib&&ib!==ay)?ib:null;
  if(o.idAyah&&o.idIbu) hubungkanPasangan(o.idAyah,o.idIbu);
  if(gBaru!==gLama && o.id!==rootAktif()){
    o.jalur=jalurDari(o);
    const dasar=o.jalur+gBaru;
    if(dasar!==o.id) gantiId(o.id,idUnik(dasar));
  }
  idAktif=o.id;
}
$('btnSimpan').addEventListener('click',()=>{
  const o=data.people[idAktif]; if(!o) return;
  terapkanForm(o);
  simpanData(); tutupModal(); render(false);
});
$('btnHapus').addEventListener('click',()=>{
  const id=idAktif; const o=data.people[id]; if(!o) return;
  if(id===rootAktif()){ alert('Orang utama (titik awal pohon) tidak bisa dihapus. Gunakan "Mulai baru" untuk mengosongkan semuanya.'); return; }
  if(!confirm(`Hapus "${o.nama||'Tanpa nama'}"? Cabang yang hanya tersambung lewat orang ini juga tidak akan tampil lagi.`)) return;
  delete data.people[id];
  Object.values(data.people).forEach(p=>{
    if(p.idAyah===id) p.idAyah=null;
    if(p.idIbu===id) p.idIbu=null;
    p.idPasangan=(p.idPasangan||[]).filter(x=>x!==id);
    if(p.statusPasangan){ delete p.statusPasangan[id]; if(!Object.keys(p.statusPasangan).length) delete p.statusPasangan; }
  });
  simpanData(); tutupModal(); render(false);
});

function orangBaru(id,gender,jalur){
  data.people[id]={id,nama:'',status:'hidup',gender,jalur,foto:'',idAyah:null,idIbu:null,idPasangan:[]};
  return data.people[id];
}
function hubungkanPasangan(a,b){
  const A=data.people[a], B=data.people[b]; if(!A||!B) return;
  A.idPasangan=A.idPasangan||[]; B.idPasangan=B.idPasangan||[];
  if(!A.idPasangan.includes(b)) A.idPasangan.push(b);
  if(!B.idPasangan.includes(a)) B.idPasangan.push(a);
}
function gantiId(lama,baru){
  const o=data.people[lama]; delete data.people[lama]; o.id=baru; data.people[baru]=o;
  Object.values(data.people).forEach(p=>{
    if(p.idAyah===lama) p.idAyah=baru;
    if(p.idIbu===lama) p.idIbu=baru;
    p.idPasangan=(p.idPasangan||[]).map(x=>x===lama?baru:x);
    if(p.statusPasangan&&p.statusPasangan[lama]){ p.statusPasangan[baru]=p.statusPasangan[lama]; delete p.statusPasangan[lama]; }
  });
}
function turunanDari(id){
  const s=new Set();
  (function r(x){ anakDari(x).forEach(a=>{ if(!s.has(a.id)){ s.add(a.id); r(a.id); } }); })(id);
  return s;
}
function isiDaftarPasangan(o){
  const w=$('daftarPasangan'); w.innerHTML='';
  const ps=(o.idPasangan||[]).filter(id=>data.people[id]);
  if(!ps.length){ w.textContent='-'; return; }
  ps.forEach(pid=>{
    const row=document.createElement('div'); row.className='psg-baris';
    const nm=document.createElement('span'); nm.textContent=namaDari(pid)||'Tanpa nama';
    const sel=document.createElement('select'); sel.dataset.id=pid;
    sel.innerHTML='<option value="menikah">Menikah</option><option value="cerai">Cerai</option>';
    sel.value=((o.statusPasangan||{})[pid]==='cerai')?'cerai':'menikah';
    row.appendChild(nm); row.appendChild(sel); w.appendChild(row);
  });
}
function terapkanStatusPasangan(o){
  document.querySelectorAll('#daftarPasangan select').forEach(sel=>{
    const pid=sel.dataset.id, q=data.people[pid]; if(!q) return;
    o.statusPasangan=o.statusPasangan||{}; q.statusPasangan=q.statusPasangan||{};
    if(sel.value==='cerai'){ o.statusPasangan[pid]='cerai'; q.statusPasangan[o.id]='cerai'; }
    else { delete o.statusPasangan[pid]; delete q.statusPasangan[o.id]; }
    if(!Object.keys(o.statusPasangan).length) delete o.statusPasangan;
    if(!Object.keys(q.statusPasangan).length) delete q.statusPasangan;
  });
}
let opsiOrtuAktif=[];
function bangunOpsiOrtu(el,opsi,pilih,idLain){
  el.innerHTML='';
  const kosong=document.createElement('option'); kosong.value=''; kosong.textContent='— belum ada —'; el.appendChild(kosong);
  const buat=p=>{ const op=document.createElement('option'); op.value=p.id; op.textContent=(p.nama||'Tanpa nama')+' ('+p.id+')'; return op; };
  const lain=idLain&&data.people[idLain];
  const psgLain=lain?(lain.idPasangan||[]).filter(id=>opsi.some(p=>p.id===id)):[];
  if(psgLain.length){
    const g1=document.createElement('optgroup'); g1.label='Pasangan '+(lain.nama||'Tanpa nama');
    psgLain.forEach(id=>g1.appendChild(buat(data.people[id])));
    el.appendChild(g1);
    const g2=document.createElement('optgroup'); g2.label='Semua orang';
    opsi.filter(p=>!psgLain.includes(p.id)).forEach(p=>g2.appendChild(buat(p)));
    el.appendChild(g2);
  } else opsi.forEach(p=>el.appendChild(buat(p)));
  el.value=pilih||'';
}
function segarkanOpsiOrtu(){
  const ay=$('fAyah').value, ib=$('fIbu').value;
  bangunOpsiOrtu($('fAyah'),opsiOrtuAktif,ay,ib);
  bangunOpsiOrtu($('fIbu'),opsiOrtuAktif,ib,ay);
}
$('fAyah').addEventListener('change',segarkanOpsiOrtu);
$('fIbu').addEventListener('change',segarkanOpsiOrtu);
function isiPilihanOrtu(o){
  const terlarang=turunanDari(o.id); terlarang.add(o.id);
  opsiOrtuAktif=Object.values(data.people).filter(p=>!terlarang.has(p.id));
  const ay=(o.idAyah&&data.people[o.idAyah])?o.idAyah:'';
  const ib=(o.idIbu&&data.people[o.idIbu])?o.idIbu:'';
  bangunOpsiOrtu($('fAyah'),opsiOrtuAktif,ay,ib);
  bangunOpsiOrtu($('fIbu'),opsiOrtuAktif,ib,ay);
}
function aturTombolOrtu(o){
  const b=document.querySelector('[data-rel="orangtua"]');
  b.textContent=!o.idAyah?'+ ayah':!o.idIbu?'+ ibu':'+ orang tua';
  b.disabled=!!(o.idAyah&&o.idIbu); b.style.opacity=b.disabled?0.4:1;
}

// Tambah anggota tanpa dialog: anggota baru langsung dibuat dengan isian kosong dan
// formnya terbuka (kursor di nama). Jenis kelamin bisa diubah di form (ID ikut menyesuaikan).
document.querySelectorAll('.modal-tambah-tombol button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const o=data.people[idAktif]; if(!o) return;
    terapkanForm(o);
    const rel=btn.dataset.rel; let baru=null;

    if(rel==='anak'){
      const ps=(o.idPasangan||[]).filter(id=>data.people[id]);
      const psgId=ps.length?ps[ps.length-1]:null; // pasangan terbaru; bisa diubah lewat pilihan Ayah/Ibu
      const sayaIbu=genderDari(o)==='f';
      const idAyah=sayaIbu ? psgId : o.id;
      const idIbu =sayaIbu ? o.id : psgId;
      const acuan=data.people[idAyah]||data.people[idIbu];
      const jOrtu=jalurDari(acuan);
      const jalur=jOrtu+'.'+nomorAnakBerikutnya(jOrtu);
      baru=orangBaru(idUnik(jalur+'m'),'m',jalur);
      baru.idAyah=idAyah; baru.idIbu=idIbu;
    }
    else if(rel==='pasangan'){
      const g=genderDari(o)==='m'?'f':'m';
      const jalur=jalurDari(o);
      baru=orangBaru(idUnik(jalur+g),g,jalur);
      hubungkanPasangan(o.id,baru.id);
    }
    else if(rel==='orangtua'){
      if(o.idAyah && o.idIbu) return;
      const sebagaiAyah=!o.idAyah;
      const lain=data.people[sebagaiAyah?o.idIbu:o.idAyah]||null;
      const g=sebagaiAyah?'m':'f';
      const jalur=lain ? jalurDari(lain) : hurufKeluargaBerikutnya();
      baru=orangBaru(idUnik(jalur+g),g,jalur);
      if(sebagaiAyah) o.idAyah=baru.id; else o.idIbu=baru.id;
      if(lain) hubungkanPasangan(lain.id,baru.id);
    }

    if(baru){ simpanData(); render(false); bukaModal(baru.id,true); }
  });
});

render(true);
pastikanPengguna();
})().catch(err=>{
  document.body.insertAdjacentHTML('beforeend','<pre style="position:fixed;inset:0;margin:0;background:#fff;color:#a00;padding:16px;z-index:999;white-space:pre-wrap;font-size:13px">Gagal memulai app:\n'+String(err&&err.stack||err)+'</pre>');
});
</script>
